<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="cartBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="cartShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Handle -->
  <path d="M 12 24 L 24 24 L 32 62 L 78 62 L 86 32 L 28 32" fill="none" stroke="url(#metalGrad)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Handle Grip -->
  <rect x="8" y="20" width="14" height="8" rx="4" fill="#ef4444"/>
  <!-- Basket Body -->
  <path d="M 27 34 L 84 34 L 77 62 L 34 62 Z" fill="url(#cartBodyGrad)" opacity="0.9" filter="url(#cartShadow)"/>
  <!-- Basket Grid Pattern -->
  <line x1="42" y1="34" x2="44" y2="62" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="56" y1="34" x2="57" y2="62" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="70" y1="34" x2="69" y2="62" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="30" y1="43" x2="81" y2="43" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <line x1="32" y1="52" x2="78" y2="52" stroke="#ffffff" stroke-width="2" opacity="0.6"/>
  <!-- Healthy Heart Badge on Cart -->
  <g transform="translate(54, 46) scale(0.7)">
    <path d="M 0 -6 C -6 -14 -16 -6 -16 2 C -16 10 0 18 0 22 C 0 18 16 10 16 2 C 16 -6 6 -14 0 -6 Z" fill="#ffffff"/>
    <path d="M 0 -4 C -5 -11 -13 -4 -13 2 C -13 9 0 15 0 19 C 0 15 13 9 13 2 C 13 -4 5 -11 0 -4 Z" fill="#ef4444"/>
  </g>
  <!-- Wheels Chassis -->
  <circle cx="38" cy="74" r="7" fill="#334155"/>
  <circle cx="38" cy="74" r="3" fill="#cbd5e1"/>
  <circle cx="72" cy="74" r="7" fill="#334155"/>
  <circle cx="72" cy="74" r="3" fill="#cbd5e1"/>
  <line x1="34" y1="62" x2="38" y2="72" stroke="url(#metalGrad)" stroke-width="4" stroke-linecap="round"/>
  <line x1="74" y1="62" x2="72" y2="72" stroke="url(#metalGrad)" stroke-width="4" stroke-linecap="round"/>
</svg>
