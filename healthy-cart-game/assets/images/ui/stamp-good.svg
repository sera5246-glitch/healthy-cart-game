<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="stampShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#15803d" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g transform="rotate(-8 80 80)" filter="url(#stampShadow)">
    <!-- Outer serrated or double ring -->
    <circle cx="80" cy="80" r="70" fill="none" stroke="#16a34a" stroke-width="5" stroke-dasharray="8,4"/>
    <circle cx="80" cy="80" r="62" fill="#f0fdf4" stroke="#22c55e" stroke-width="3"/>
    <!-- Stars -->
    <path d="M 80 25 L 83 32 L 90 32 L 85 36 L 87 43 L 80 39 L 73 43 L 75 36 L 70 32 L 77 32 Z" fill="#eab308"/>
    <!-- Text arc or bold center text -->
    <text x="80" y="70" text-anchor="middle" font-family="'Pretendard', 'NanumSquareRound', sans-serif" font-weight="900" font-size="20" fill="#15803d" letter-spacing="1">참 잘했어요!</text>
    <text x="80" y="96" text-anchor="middle" font-family="'Pretendard', 'NanumSquareRound', sans-serif" font-weight="800" font-size="14" fill="#16a34a">건강 안심 간식</text>
    <path d="M 50 110 L 80 125 L 110 110" fill="none" stroke="#22c55e" stroke-width="3" stroke-linecap="round"/>
    <!-- Checked icon -->
    <path d="M 68 88 L 76 96 L 94 76" fill="none" stroke="#16a34a" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
