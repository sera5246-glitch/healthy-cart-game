<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="35%" stop-color="#facc15"/>
      <stop offset="70%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="goldShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#78350f" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Cup Base -->
  <polygon points="32,84 68,84 64,74 36,74" fill="#78350f"/>
  <rect x="28" y="84" width="44" height="10" rx="3" fill="#451a03"/>
  <rect x="34" y="86" width="32" height="6" fill="#fbbf24"/>
  <!-- Cup Stem -->
  <path d="M 44 60 L 56 60 L 54 74 L 46 74 Z" fill="url(#goldGrad)"/>
  <ellipse cx="50" cy="60" rx="9" ry="4" fill="#eab308"/>
  <!-- Cup Handles -->
  <path d="M 32 28 C 12 28 12 50 32 54 L 33 48 C 20 45 20 34 33 34 Z" fill="url(#goldGrad)" filter="url(#goldShine)"/>
  <path d="M 68 28 C 88 28 88 50 68 54 L 67 48 C 80 45 80 34 67 34 Z" fill="url(#goldGrad)" filter="url(#goldShine)"/>
  <!-- Cup Main Body -->
  <path d="M 30 20 L 70 20 C 70 48 58 60 50 60 C 42 60 30 48 30 20 Z" fill="url(#goldGrad)" filter="url(#goldShine)"/>
  <!-- Rim -->
  <ellipse cx="50" cy="20" rx="20" ry="5" fill="#fde047" stroke="#ca8a04" stroke-width="1"/>
  <!-- Star on cup -->
  <path d="M 50 28 L 52 34 L 58 34 L 53 38 L 55 44 L 50 40 L 45 44 L 47 38 L 42 34 L 48 34 Z" fill="#ffffff" stroke="#eab308" stroke-width="0.5"/>
