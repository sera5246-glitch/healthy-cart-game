<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="lensGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" stop-opacity="0.85"/>
      <stop offset="60%" stop-color="#bae6fd" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.6"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="handleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#451a03"/>
    </linearGradient>
    <filter id="glassShine" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Handle -->
  <g transform="rotate(45 50 50)">
    <rect x="44" y="68" width="12" height="32" rx="6" fill="url(#handleGrad)"/>
    <rect x="42" y="62" width="16" height="8" rx="2" fill="#d97706"/>
    <circle cx="50" cy="94" r="3" fill="#fbbf24"/>
  </g>
  <!-- Rim -->
  <circle cx="42" cy="42" r="32" fill="none" stroke="url(#rimGrad)" stroke-width="8" filter="url(#glassShine)"/>
  <!-- Glass Lens -->
  <circle cx="42" cy="42" r="28" fill="url(#lensGrad)"/>
  <!-- Reflection curve -->
  <path d="M 24 28 A 20 20 0 0 1 54 22 A 23 23 0 0 0 24 48 Z" fill="#ffffff" opacity="0.65"/>
  <circle cx="30" cy="52" r="3" fill="#ffffff" opacity="0.7"/>
  <!-- Nutrition target crosshair -->
  <circle cx="42" cy="42" r="10" fill="none" stroke="#0284c7" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.7"/>
  <line x1="42" y1="28" x2="42" y2="34" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="42" y1="50" x2="42" y2="56" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="28" y1="42" x2="34" y2="42" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
  <line x1="50" y1="42" x2="56" y2="42" stroke="#0284c7" stroke-width="2" stroke-linecap="round"/>
</svg>
