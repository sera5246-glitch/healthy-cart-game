<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160">
  <defs>
    <filter id="warnShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="#b91c1c" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g transform="rotate(8 80 80)" filter="url(#warnShadow)">
    <circle cx="80" cy="80" r="70" fill="none" stroke="#dc2626" stroke-width="5" stroke-dasharray="8,4"/>
    <circle cx="80" cy="80" r="62" fill="#fef2f2" stroke="#ef4444" stroke-width="3"/>
    <!-- Warning sign triangle -->
    <path d="M 80 28 L 88 42 L 72 42 Z" fill="#ef4444"/>
    <text x="80" y="70" text-anchor="middle" font-family="'Pretendard', 'NanumSquareRound', sans-serif" font-weight="900" font-size="20" fill="#b91c1c" letter-spacing="1">영양 주의!</text>
    <text x="80" y="96" text-anchor="middle" font-family="'Pretendard', 'NanumSquareRound', sans-serif" font-weight="800" font-size="14" fill="#dc2626">빨간불 성분 확인</text>
    <path d="M 50 110 L 80 125 L 110 110" fill="none" stroke="#ef4444" stroke-width="3" stroke-linecap="round"/>
    <circle cx="80" cy="86" r="3" fill="#dc2626"/>
    <line x1="80" y1="74" x2="80" y2="81" stroke="#dc2626" stroke-width="3" stroke-linecap="round"/>
  </g>
</svg>
