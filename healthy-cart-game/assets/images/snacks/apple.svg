<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="appleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="70%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="fruitShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Bag / Cup Container -->
  <rect x="36" y="55" width="128" height="150" rx="20" fill="#f0fdf4" stroke="#86efac" stroke-width="2.5" filter="url(#fruitShadow)"/>
  <!-- Top Fresh Seal -->
  <path d="M 36 75 L 164 75" stroke="#22c55e" stroke-width="4"/>
  <rect x="65" y="42" width="70" height="22" rx="11" fill="#16a34a"/>
  <text x="100" y="57" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="11" fill="#ffffff">생생 과일팩</text>
  <!-- Apple Slice Graphics -->
  <g transform="translate(100, 130)">
    <!-- Apple Main -->
    <path d="M 0 -35 C 22 -35 42 -10 38 20 C 34 42 12 48 0 44 C -12 48 -34 42 -38 20 C -42 -10 -22 -35 0 -35 Z" fill="url(#appleGrad)"/>
    <!-- Stem & Leaf -->
    <path d="M 0 -35 Q 6 -48 14 -46" fill="none" stroke="#78350f" stroke-width="3" stroke-linecap="round"/>
    <path d="M 4 -40 Q 18 -46 20 -36 Q 10 -34 4 -40 Z" fill="#22c55e"/>
    <!-- Sliced Apple Wedge in front -->
    <g transform="translate(12, 10) rotate(15)">
      <path d="M -20 -15 C 5 -20 22 -5 22 20 C 0 24 -15 10 -20 -15 Z" fill="#fef9c3" stroke="#ef4444" stroke-width="3"/>
      <!-- Seeds -->
      <ellipse cx="-4" cy="5" rx="3" ry="1.8" fill="#78350f" transform="rotate(30 -4 5)"/>
    </g>
    <!-- Shine -->
    <ellipse cx="-20" cy="-12" rx="7" ry="14" fill="#ffffff" opacity="0.3" transform="rotate(-20 -20 -12)"/>
  </g>
  <!-- Label -->
  <rect x="52" y="175" width="96" height="20" rx="10" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="100" y="189" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="11" fill="#15803d">아삭 슬라이스 사과</text>
</svg>
