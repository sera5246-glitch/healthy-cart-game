<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="oatWrapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d"/>
      <stop offset="60%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#14532d"/>
    </linearGradient>
    <filter id="barShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Long Bar Wrapper Body -->
  <rect x="36" y="42" width="128" height="156" rx="8" fill="url(#oatWrapGrad)" filter="url(#barShadow)"/>
  <!-- Zigzag ends -->
  <line x1="36" y1="50" x2="164" y2="50" stroke="#14532d" stroke-width="3" stroke-dasharray="3,2"/>
  <line x1="36" y1="190" x2="164" y2="190" stroke="#14532d" stroke-width="3" stroke-dasharray="3,2"/>
  <!-- Oatmeal Bar Illustration Graphic -->
  <g transform="translate(100, 130) rotate(-15)">
    <rect x="-42" y="-22" width="84" height="44" rx="6" fill="#d97706" stroke="#92400e" stroke-width="2"/>
    <!-- Grains, seeds, oat flakes -->
    <ellipse cx="-20" cy="-10" rx="5" ry="3" fill="#fef3c7"/>
    <ellipse cx="10" cy="-8" rx="6" ry="3" fill="#fef3c7"/>
    <ellipse cx="-5" cy="8" rx="5" ry="3" fill="#fef3c7"/>
    <ellipse cx="25" cy="6" rx="4" ry="2.5" fill="#fef3c7"/>
    <circle cx="-15" cy="6" r="3" fill="#78350f"/>
    <circle cx="15" cy="-2" r="3" fill="#78350f"/>
  </g>
  <!-- Yellow Banana Graphic -->
  <path d="M 130 90 Q 155 105 150 125 Q 145 115 130 102 Z" fill="#fde047" stroke="#ca8a04" stroke-width="1.5"/>
  <!-- Brand Label -->
  <rect x="44" y="60" width="112" height="28" rx="6" fill="#ffffff"/>
  <text x="100" y="79" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="14" fill="#166534">통밀 바나나바</text>
  <!-- Badge -->
  <rect x="55" y="166" width="90" height="16" rx="8" fill="#ca8a04"/>
  <text x="100" y="178" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="9" fill="#ffffff">식이섬유 듬뿍 38g</text>
</svg>
