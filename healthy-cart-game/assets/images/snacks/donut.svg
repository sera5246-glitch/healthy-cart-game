<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="doughGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="donutShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Window Box Packaging -->
  <rect x="34" y="36" width="132" height="170" rx="14" fill="#fdf2f8" stroke="#f472b6" stroke-width="2.5" filter="url(#donutShadow)"/>
  <rect x="34" y="36" width="132" height="32" rx="14" fill="#ec4899"/>
  <text x="100" y="58" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="13" fill="#ffffff">달콤 글레이즈드 도넛</text>
  <!-- Donut Graphic -->
  <g transform="translate(100, 130)">
    <!-- Dough ring -->
    <ellipse cx="0" cy="0" rx="46" ry="42" fill="url(#doughGrad)"/>
    <!-- Glaze coating -->
    <path d="M -40 -10 C -42 -30 42 -30 40 -10 C 35 15 25 35 0 35 C -25 35 -35 15 -40 -10 Z" fill="#fce7f3" opacity="0.9"/>
    <!-- Center Hole -->
    <ellipse cx="0" cy="0" rx="18" ry="16" fill="#fdf2f8" stroke="#d97706" stroke-width="2"/>
    <!-- Sugar glaze drips -->
    <circle cx="-16" cy="18" r="4" fill="#fce7f3"/>
    <circle cx="14" cy="22" r="5" fill="#fce7f3"/>
    <circle cx="28" cy="10" r="3.5" fill="#fce7f3"/>
    <!-- Glaze shine -->
    <path d="M -26 -20 Q 0 -32 26 -20" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
  </g>
  <rect x="58" y="178" width="84" height="18" rx="9" fill="#be185d"/>
  <text x="100" y="191" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="800" font-size="9" fill="#ffffff">설탕코팅 1개 52g</text>
</svg>
