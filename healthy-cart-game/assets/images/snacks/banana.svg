<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="bananaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#fde047"/>
      <stop offset="80%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#ca8a04"/>
    </linearGradient>
    <filter id="bananaShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Background Badge / Tray -->
  <rect x="36" y="50" width="128" height="155" rx="16" fill="#fefce8" stroke="#fde047" stroke-width="2.5" filter="url(#bananaShadow)"/>
  <rect x="60" y="40" width="80" height="20" rx="10" fill="#eab308"/>
  <text x="100" y="54" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="10" fill="#ffffff">영양 든든 생과일</text>
  <!-- Banana Bunch -->
  <g transform="translate(100, 125)">
    <!-- Back Banana -->
    <path d="M -30 -35 C 10 -45 50 -10 40 45 C 30 38 10 0 -22 -22 Z" fill="#ca8a04" opacity="0.6"/>
    <!-- Main Banana Curve -->
    <path d="M -35 -30 C 5 -42 55 -5 42 45 C 28 42 2 -5 -25 -18 Z" fill="url(#bananaGrad)" stroke="#a16207" stroke-width="2"/>
    <!-- Banana Stem -->
    <polygon points="-35,-30 -30,-42 -22,-38 -28,-26" fill="#65a30d"/>
    <!-- Banana Tip -->
    <circle cx="42" cy="45" r="4" fill="#78350f"/>
    <!-- Ridges -->
    <path d="M -28 -24 C 0 -25 36 2 34 38" fill="none" stroke="#fef08a" stroke-width="3" opacity="0.8"/>
  </g>
  <!-- Label -->
  <rect x="50" y="172" width="100" height="22" rx="11" fill="#ffffff" stroke="#eab308" stroke-width="2"/>
  <text x="100" y="187" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="12" fill="#854d0e">자연 그대로 바나나</text>
</svg>
