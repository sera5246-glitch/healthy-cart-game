<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="chocGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03"/>
      <stop offset="50%" stop-color="#78350f"/>
      <stop offset="100%" stop-color="#270e02"/>
    </linearGradient>
    <linearGradient id="foilGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c"/>
      <stop offset="60%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#991b1b"/>
    </linearGradient>
    <filter id="chocShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Wrapper Pouch -->
  <rect x="30" y="35" width="140" height="170" rx="16" fill="url(#foilGrad)" filter="url(#chocShadow)"/>
  <!-- Pouch crimps -->
  <line x1="30" y1="45" x2="170" y2="45" stroke="#7f1d1d" stroke-width="3" stroke-dasharray="4,2"/>
  <line x1="30" y1="195" x2="170" y2="195" stroke="#7f1d1d" stroke-width="3" stroke-dasharray="4,2"/>
  <!-- Gold Lettering & Banner -->
  <ellipse cx="100" cy="72" rx="55" ry="24" fill="#fbbf24"/>
  <text x="100" y="78" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="20" fill="#78350f">초코파이</text>
  <!-- Choco Pie Illustration inside circle -->
  <circle cx="100" cy="138" r="42" fill="#ffffff" stroke="#fcd34d" stroke-width="3"/>
  <!-- Pie Graphic: Top Biscuit -->
  <ellipse cx="100" cy="128" rx="34" ry="14" fill="url(#chocGrad)"/>
  <!-- Marshmallow Layer -->
  <ellipse cx="100" cy="136" rx="32" ry="12" fill="#ffffff" stroke="#f1f5f9" stroke-width="2"/>
  <!-- Bottom Biscuit -->
  <ellipse cx="100" cy="146" rx="34" ry="14" fill="url(#chocGrad)"/>
  <!-- Melted chocolate drizzle -->
  <path d="M 80 126 Q 90 135 100 125 Q 110 135 120 126" fill="none" stroke="#270e02" stroke-width="2"/>
  <!-- Tag -->
  <rect x="55" y="178" width="90" height="16" rx="8" fill="#451a03"/>
  <text x="100" y="190" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="10" fill="#fde047">달콤 마시멜로 35g</text>
</svg>
