<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="canGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dc2626"/>
      <stop offset="35%" stop-color="#ef4444"/>
      <stop offset="65%" stop-color="#f87171"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8"/>
      <stop offset="50%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <filter id="canShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Can Top Rim -->
  <ellipse cx="100" cy="40" rx="46" ry="12" fill="url(#rimGrad)" filter="url(#canShadow)"/>
  <ellipse cx="100" cy="38" rx="40" ry="9" fill="#cbd5e1"/>
  <!-- Pull tab -->
  <ellipse cx="100" cy="38" rx="14" ry="5" fill="#475569"/>
  <!-- Can Body -->
  <path d="M 54 40 L 54 190 Q 100 206 146 190 L 146 40 Q 100 28 54 40 Z" fill="url(#canGrad)" filter="url(#canShadow)"/>
  <!-- Can Bottom Rim -->
  <ellipse cx="100" cy="190" rx="46" ry="12" fill="url(#rimGrad)"/>
  <!-- Dynamic Soda Wave Ribbon -->
  <path d="M 54 85 Q 90 120 146 75 L 146 120 Q 100 160 54 125 Z" fill="#ffffff" opacity="0.95"/>
  <path d="M 54 110 Q 95 140 146 105 L 146 112 Q 100 146 54 117 Z" fill="#facc15"/>
  <!-- Soda Can Text -->
  <text x="100" y="80" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="20" fill="#ffffff" letter-spacing="2">톡톡 쿨!</text>
  <text x="100" y="112" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="22" fill="#dc2626" font-style="italic">COLA</text>
  <!-- Fizz Bubbles -->
  <circle cx="70" cy="65" r="4" fill="#ffffff" opacity="0.7"/>
  <circle cx="85" cy="55" r="2.5" fill="#ffffff" opacity="0.7"/>
  <circle cx="125" cy="65" r="3" fill="#ffffff" opacity="0.7"/>
  <circle cx="135" cy="150" r="4" fill="#ffffff" opacity="0.6"/>
  <circle cx="75" cy="160" r="5" fill="#ffffff" opacity="0.6"/>
  <!-- Volume tag -->
  <rect x="65" y="155" width="70" height="18" rx="9" fill="#000000" opacity="0.4"/>
  <text x="100" y="168" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="10" fill="#ffffff">청량탄산 250ml</text>
</svg>
