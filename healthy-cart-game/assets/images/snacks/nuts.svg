<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="kraftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="50%" stop-color="#b45309"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>
    <filter id="pouchShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Kraft Paper Pouch Body -->
  <path d="M 40 40 L 160 40 L 155 200 L 45 200 Z" fill="url(#kraftGrad)" filter="url(#pouchShadow)"/>
  <!-- Top Seal -->
  <rect x="40" y="32" width="120" height="14" rx="2" fill="#78350f"/>
  <circle cx="100" cy="39" r="3" fill="#ffffff" opacity="0.7"/>
  <!-- Pouch Window (Transparent film showing almonds & walnuts) -->
  <ellipse cx="100" cy="135" rx="44" ry="34" fill="#fef3c7" stroke="#ffffff" stroke-width="3"/>
  <!-- Almonds -->
  <ellipse cx="85" cy="130" rx="14" ry="9" fill="#9a3412" stroke="#7c2d12" stroke-width="1.5" transform="rotate(-30 85 130)"/>
  <ellipse cx="115" cy="135" rx="14" ry="9" fill="#b45309" stroke="#7c2d12" stroke-width="1.5" transform="rotate(25 115 135)"/>
  <!-- Walnut -->
  <circle cx="100" cy="148" r="12" fill="#d97706" stroke="#92400e" stroke-width="1.5"/>
  <path d="M 96 140 Q 100 152 96 156 M 104 140 Q 100 152 104 156" fill="none" stroke="#78350f" stroke-width="1.5"/>
  <!-- Cranberry -->
  <circle cx="82" cy="148" r="6" fill="#be123c"/>
  <circle cx="118" cy="120" r="5" fill="#be123c"/>
  <!-- Label Text -->
  <rect x="52" y="62" width="96" height="26" rx="6" fill="#ffffff"/>
  <text x="100" y="80" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="14" fill="#78350f">하루 한줌 견과</text>
  <!-- Leaf Icon for Natural Organic vibe -->
  <circle cx="100" cy="55" r="9" fill="#16a34a"/>
  <path d="M 96 57 Q 100 48 104 57 Z" fill="#ffffff"/>
  <!-- Tag -->
  <rect x="55" y="180" width="90" height="14" rx="7" fill="#15803d"/>
  <text x="100" y="191" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="9" fill="#ffffff">무염 볶음 견과 25g</text>
</svg>
