<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="milkCartonGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="60%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="cartonShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Carton Gable Top -->
  <polygon points="60,65 100,30 140,65" fill="#3b82f6" filter="url(#cartonShadow)"/>
  <polygon points="100,30 140,65 155,55 115,22" fill="#2563eb"/>
  <rect x="96" y="18" width="8" height="15" rx="2" fill="#1d4ed8"/>
  <!-- Carton Body -->
  <polygon points="50,65 140,65 140,205 50,205" fill="url(#milkCartonGrad)" filter="url(#cartonShadow)"/>
  <polygon points="140,65 160,55 160,190 140,205" fill="#cbd5e1"/>
  <!-- Blue Header Banner -->
  <rect x="50" y="65" width="90" height="35" fill="#3b82f6"/>
  <text x="95" y="88" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="16" fill="#ffffff">저지방 우유</text>
  <!-- Cow / Pasture Graphic -->
  <circle cx="95" cy="135" r="28" fill="#dbeafe"/>
  <!-- Milk Drop Icon -->
  <path d="M 95 118 C 105 130 108 140 108 145 C 108 152 102 158 95 158 C 88 158 82 152 82 145 C 82 140 85 130 95 118 Z" fill="#3b82f6"/>
  <circle cx="91" cy="142" r="3" fill="#ffffff"/>
  <!-- Low Fat Badge -->
  <rect x="62" y="172" width="66" height="20" rx="10" fill="#10b981"/>
  <text x="95" y="186" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="11" fill="#ffffff">지방 1.0% · 칼슘</text>
</svg>
