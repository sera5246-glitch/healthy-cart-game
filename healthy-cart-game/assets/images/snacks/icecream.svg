<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="iceShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Background Badge / Cup -->
  <rect x="36" y="36" width="128" height="170" rx="16" fill="#fdf4ff" stroke="#e879f9" stroke-width="2.5" filter="url(#iceShadow)"/>
  <rect x="36" y="36" width="128" height="30" rx="16" fill="#c026d3"/>
  <text x="100" y="56" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="13" fill="#ffffff">바닐라 초코콘</text>
  <!-- Ice Cream Swirl -->
  <g transform="translate(100, 115)">
    <!-- Swirl Top -->
    <path d="M 0 -50 C 6 -60 12 -55 8 -42 C 18 -42 22 -30 14 -22 C 26 -20 28 -5 18 4 C 28 8 26 22 10 22 C -10 22 -28 8 -18 4 C -28 -5 -26 -20 -14 -22 C -22 -30 -18 -42 -8 -42 C -12 -55 -6 -60 0 -50 Z" fill="#fffbeb" stroke="#fef08a" stroke-width="2"/>
    <!-- Chocolate Drizzle -->
    <path d="M -12 -42 Q 0 -35 10 -40 M -16 -24 Q 0 -15 16 -22 M -18 -2 Q 0 8 16 0" fill="none" stroke="#451a03" stroke-width="3" stroke-linecap="round"/>
    <circle cx="2" cy="-48" r="4" fill="#ef4444"/>
    <!-- Cone Body -->
    <polygon points="-22,18 22,18 0,82" fill="url(#coneGrad)" stroke="#78350f" stroke-width="2"/>
    <!-- Waffle Cone Grid -->
    <line x1="-16" y1="28" x2="16" y2="40" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
    <line x1="-11" y1="42" x2="11" y2="54" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
    <line x1="16" y1="28" x2="-16" y2="40" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
    <line x1="11" y1="42" x2="-11" y2="54" stroke="#78350f" stroke-width="1.5" opacity="0.6"/>
  </g>
  <rect x="58" y="178" width="84" height="18" rx="9" fill="#701a75"/>
  <text x="100" y="191" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="800" font-size="9" fill="#ffffff">유지방 8% 140ml</text>
</svg>
