<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 240" width="200" height="240">
  <defs>
    <linearGradient id="cookieGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <filter id="cookieShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feDropShadow dx="3" dy="6" stdDeviation="5" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>
  <!-- Foil Pouch Wrapper -->
  <rect x="36" y="38" width="128" height="165" rx="16" fill="#78350f" filter="url(#cookieShadow)"/>
  <rect x="36" y="55" width="128" height="28" fill="#ca8a04"/>
  <text x="100" y="74" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="900" font-size="14" fill="#ffffff">수제 초코칩 쿠키</text>
  <!-- Cookie Illustration -->
  <g transform="translate(100, 135)">
    <circle cx="0" cy="0" r="42" fill="url(#cookieGrad)" stroke="#92400e" stroke-width="2"/>
    <!-- Chocolate Chunks -->
    <rect x="-24" y="-18" width="10" height="9" rx="3" fill="#381a08" transform="rotate(15 -24 -18)"/>
    <rect x="12" y="-22" width="12" height="10" rx="3" fill="#381a08" transform="rotate(-20 12 -22)"/>
    <rect x="-8" y="4" width="13" height="11" rx="3" fill="#381a08" transform="rotate(40 -8 4)"/>
    <rect x="-26" y="16" width="11" height="9" rx="3" fill="#381a08" transform="rotate(-15 -26 16)"/>
    <rect x="18" y="14" width="12" height="10" rx="3" fill="#381a08" transform="rotate(25 18 14)"/>
    <!-- Cracks -->
    <path d="M -15 -5 Q 0 8 15 -2" fill="none" stroke="#78350f" stroke-width="2"/>
  </g>
  <rect x="62" y="178" width="76" height="16" rx="8" fill="#451a03"/>
  <text x="100" y="190" text-anchor="middle" font-family="'Pretendard', sans-serif" font-weight="800" font-size="9" fill="#fef08a">달콤 버터 45g</text>
</svg>
